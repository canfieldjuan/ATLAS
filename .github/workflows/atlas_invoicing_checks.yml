jobs:
  atlas-invoicing-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atlas_receivables_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_receivables_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_RECEIVABLES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_receivables_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run invoicing approval blocker tests
        run: |
          python -m pytest \
            tests/test_monthly_invoice_generation.py \
            -k "update_invoice_clears_needs_hours_when_line_items_are_billable or line_items_are_billable_requires_all_positive_quantities" \
            -q

      - name: Run legacy monthly auto-invoice opt-in contract tests
        run: |
          python -m pytest \
            tests/test_legacy_monthly_autoinvoice_opt_in.py \
            -q

      - name: Run receivables ledger and repository tests
        run: |
          python -m pytest \
            tests/test_eom_render_profile.py \
            tests/test_receivables.py \
            tests/test_eom_billing_recipients.py \
            tests/test_eom_payment_receipts.py \
            tests/test_residential_payment_receipt_delivery.py \
            tests/test_commercial_billing_candidates.py \
            tests/test_commercial_billing_candidate_overrides.py \
            tests/test_commercial_billing_runs.py \
            tests/test_commercial_billing_approvals.py \
            tests/test_commercial_billing_gmail_drafts.py \
            tests/test_commercial_billing_manual_square_invoices.py \
            tests/test_invoice_repository.py \
            tests/test_invoice_pdf.py \
            -q

      - name: Run invoicing MCP + OAuth surface tests
        run: |
          python -m pytest \
            tests/test_invoicing_readonly_mcp.py \
            tests/test_invoicing_readonly_oauth.py \
            tests/test_invoicing_draft_writer_mcp.py \
            tests/test_invoicing_draft_writer_oauth.py \
            -q

  legacy-monthly-writer-harness:
    name: Legacy monthly writer harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atlas_receivables_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_receivables_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_LEGACY_MONTHLY_AUTOINVOICE_WRITER_HARNESS: "1"
      ATLAS_LEGACY_MONTHLY_AUTOINVOICE_WRITER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_receivables_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run isolated legacy monthly writer harness
        run: |
          python -m pytest \
            tests/test_legacy_monthly_autoinvoice_writer_harness.py \
            -q
