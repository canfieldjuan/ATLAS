name: Security Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  secrets-pr:
    name: Gitleaks PR secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve trusted baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          baseline=".gitleaks-baseline-ci.json"
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          if git cat-file -e "origin/${BASE_REF}:docs/security/gitleaks-baseline.json" 2>/dev/null; then
            git show "origin/${BASE_REF}:docs/security/gitleaks-baseline.json" > "$baseline"
            echo "Using Gitleaks baseline from origin/${BASE_REF}."
          elif [ -f docs/security/gitleaks-baseline.json ]; then
            cp docs/security/gitleaks-baseline.json "$baseline"
            echo "Using adoption baseline from this PR because ${BASE_REF} has no baseline yet."
          else
            echo "No Gitleaks baseline found; scanning without a baseline."
          fi

      - name: Scan pull request commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          baseline_args=()
          if [ -s .gitleaks-baseline-ci.json ]; then
            baseline_args=(--baseline-path /repo/.gitleaks-baseline-ci.json)
          fi
          scan_range="origin/${BASE_REF}..HEAD"
          echo "Scanning Gitleaks PR range: ${scan_range}"

          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git \
            --redact \
            --verbose \
            --log-opts="${scan_range}" \
            "${baseline_args[@]}" \
            /repo

  secrets-full-history:
    name: Gitleaks full-history secret scan
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve baseline
        run: |
          set -euo pipefail
          if [ -f docs/security/gitleaks-baseline.json ]; then
            cp docs/security/gitleaks-baseline.json .gitleaks-baseline-ci.json
            echo "Using checked-in Gitleaks baseline from this trusted ref."
          else
            echo "No Gitleaks baseline found; scanning without a baseline."
          fi

      - name: Scan complete git history
        run: |
          set -euo pipefail
          baseline_args=()
          if [ -s .gitleaks-baseline-ci.json ]; then
            baseline_args=(--baseline-path /repo/.gitleaks-baseline-ci.json)
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git \
            --redact \
            --verbose \
            --log-opts="HEAD" \
            "${baseline_args[@]}" \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif \
            /repo

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: gitleaks.sarif

  pip-audit:
    name: pip-audit (${{ matrix.requirements }})
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements.txt
          - atlas_edge/requirements.txt
          - atlas_video-processing/requirements.txt
          - atlas_video-processing/ingest/drone_client/requirements.txt
          - atlas_video-processing/processing/video_stream_processor/requirements.txt
          - graphiti-wrapper/requirements.txt
          - requirements.asr.txt
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit

      - name: Audit Python requirements
        continue-on-error: true
        run: timeout 15m python -m pip_audit -r "${{ matrix.requirements }}" --progress-spinner off

  osv-full:
    name: OSV dependency scan
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./

  semgrep:
    name: Semgrep SAST
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --quiet semgrep

      - name: Run Semgrep rulesets
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/python \
            --metrics=off \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: semgrep.sarif

  trivy-config:
    name: Trivy config scan
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan Docker/IaC configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-config.sarif
          skip-dirs: ".venv,.venv-*,node_modules,worktrees,data,third_party"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-config.sarif

  checkov:
    name: Checkov IaC scan
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12
        with:
          directory: .
          framework: dockerfile,github_actions,terraform,yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          quiet: true
          skip_path: ".venv,.venv-*,node_modules,worktrees,data,third_party"
          soft_fail: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: checkov.sarif
