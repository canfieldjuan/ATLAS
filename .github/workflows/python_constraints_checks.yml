name: Python Constraints Checks

on:
  pull_request:
    paths:
      - "constraints.root-asr.txt"
      - "requirements.txt"
      - "requirements.asr.txt"
      - "scripts/compile_root_asr_constraints.py"
      - "tests/test_compile_root_asr_constraints.py"
      - ".github/workflows/python_constraints_checks.yml"
  push:
    branches: [main]
    paths:
      - "constraints.root-asr.txt"
      - "requirements.txt"
      - "requirements.asr.txt"
      - "scripts/compile_root_asr_constraints.py"
      - "tests/test_compile_root_asr_constraints.py"
      - ".github/workflows/python_constraints_checks.yml"

permissions:
  contents: read

jobs:
  root-asr-constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e2f1cdd8f0f3b7cb1a1b # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pinned lock tooling
        run: python -m pip install uv==0.10.10 pytest==9.1.1
      - name: Verify Python 3.10 and 3.11 root/ASR lock regeneration
        run: python scripts/compile_root_asr_constraints.py --check
      - name: Run constraints contract tests
        run: python -m pytest tests/test_compile_root_asr_constraints.py -q
