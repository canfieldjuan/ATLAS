name: AI Reconciliation (review retrigger)

# Trusted follow-up for review events (#1949 review round 2). Review-event
# workflow runs resolve their workflow file PR-side, so they cannot be
# trusted to refresh the required `live-reconciliation` context -- but a
# `workflow_run` workflow always executes from the DEFAULT branch. When the
# AI Reconciliation workflow completes for a review event (the advisory
# job), this follow-up re-runs the latest `pull_request_target` run for the
# same head SHA, so the required context is re-evaluated by trusted base
# code whenever a bot review or review comment lands after the last
# push/body edit. GitHub Actions does not expose
# `pull_request_review_thread` as a workflow trigger, so thread-resolution-only
# changes are refreshed by the next supported PR/review/review-comment event
# instead of this retrigger path.
#
# Loop-safe: the rerun completes with event == pull_request_target, which
# this job's `if` ignores. No checkout and no repo scripts: the inline
# steps below are the default-branch version by construction.

on:
  workflow_run:
    workflows: ["AI Reconciliation (live)"]
    types: [completed]

permissions:
  actions: write
  pull-requests: read

jobs:
  retrigger-required-context:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' ||
      github.event.workflow_run.event == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rerun latest trusted target run for this head
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head_sha="${WORKFLOW_RUN_HEAD_SHA}"
          target_runs_path="repos/${GITHUB_REPOSITORY}/actions/workflows/ai_reconciliation_live.yml/runs?event=pull_request_target&head_sha=${head_sha}&per_page=1"
          run_id=""
          status=""
          for attempt in $(seq 1 72); do
            run_id=$(gh api "${target_runs_path}" --jq '.workflow_runs[0].id // empty')
            if [ -z "${run_id}" ]; then
              echo "target run for ${head_sha} is not visible yet; retry ${attempt}/72"
              sleep 10
              continue
            fi
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status // empty')
            if [ "${status}" = "completed" ]; then
              break
            fi
            echo "target run ${run_id} is ${status:-unknown}; retry ${attempt}/72"
            sleep 10
          done
          if [ -z "${run_id}" ]; then
            echo "no pull_request_target run for ${head_sha}; nothing to refresh"
            exit 0
          fi
          if [ "${status}" != "completed" ]; then
            echo "target run ${run_id} did not complete before retrigger timeout"
            exit 1
          fi
          echo "re-running trusted run ${run_id} for ${head_sha}"
          for attempt in $(seq 1 6); do
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun"; then
              exit 0
            fi
            echo "rerun request for ${run_id} was rejected; retry ${attempt}/6"
            sleep 10
          done
          echo "could not rerun trusted run ${run_id}"
          exit 1
