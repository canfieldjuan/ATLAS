name: Atlas Migrations Runner Checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/atlas_migrations_runner_checks.yml"
      - "atlas_brain/storage/migrations/**"
      - "atlas_brain/services/b2b/watchlist_alerts.py"
      - "scripts/check_migration_content_integrity.py"
      - "tests/test_migrations_runner.py"
      - "tests/test_migration_content_integrity_preflight.py"
      - "tests/test_commercial_billing_runs.py"
      - "tests/test_b2b_company_signal_promotion_migration_repair.py"
      - "tests/test_b2b_watchlist_alert_events_migration_repair.py"
      - "tests/test_eom_public_onboarding_migration_repair.py"
      - "tests/test_presence_unknown_count_migration_repair.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atlas_migrations_runner_checks.yml"
      - "atlas_brain/storage/migrations/**"
      - "atlas_brain/services/b2b/watchlist_alerts.py"
      - "scripts/check_migration_content_integrity.py"
      - "tests/test_migrations_runner.py"
      - "tests/test_migration_content_integrity_preflight.py"
      - "tests/test_commercial_billing_runs.py"
      - "tests/test_b2b_company_signal_promotion_migration_repair.py"
      - "tests/test_b2b_watchlist_alert_events_migration_repair.py"
      - "tests/test_eom_public_onboarding_migration_repair.py"
      - "tests/test_presence_unknown_count_migration_repair.py"

jobs:
  atlas-migrations-runner-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_migration_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_migration_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_MIGRATION_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_migration_tests
      ATLAS_RECEIVABLES_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_migration_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            asyncpg \
            fastapi==0.139.0 \
            httpx==0.28.1 \
            pytest \
            pytest-asyncio \
            pydantic \
            pydantic-settings

      # The runner tests mostly use a fake pool, but this disposable service also
      # executes the public-onboarding legacy-schema repair against PostgreSQL.
      - name: Run migration checks
        run: |
          python -m pytest \
            tests/test_migrations_runner.py \
            tests/test_migration_content_integrity_preflight.py \
            tests/test_b2b_company_signal_promotion_migration_repair.py \
            tests/test_b2b_watchlist_alert_events_migration_repair.py \
            tests/test_eom_public_onboarding_migration_repair.py \
            tests/test_presence_unknown_count_migration_repair.py \
            -q
          python -m pytest \
            tests/test_commercial_billing_runs.py \
            -k "historical_379" \
            -q
