name: Contact Write Boundary

# Fails when a new SQL write to the `contacts` table appears outside the
# approved provider module (Website#108, Slice 0A under #107/#105).
#
# Trusted-base execution. `pull_request_target` resolves THIS workflow file
# from the base branch, and the checker plus its allow-list are checked out
# from the base SHA. The PR tree is fetched separately and scanned as DATA.
#
# The first version ran the PR's own copy of the checker against itself, which
# made the gate self-defeating: a PR adding a forbidden writer could widen
# `INSERT_ALLOWED`, weaken `classify()`, or rewrite the self-tests in the same
# diff and publish a green `contact-write-boundary` context. Same reasoning and
# same shape as diff_budget.yml.
#
# The PR job below matches the shape audited by
# scripts/audit_workflow_security_posture.py: an event-name `if` guard, a
# SHA-pinned FIRST step checking out `github.event.pull_request.base.sha`, and
# explicit enrollment in ALLOWED_PULL_REQUEST_TARGET_JOBS. Post-merge runs live
# in a separate `push`-guarded job, mirroring pre_push_audit.yml, so neither job
# can execute on the wrong event and neither needs a conditional checkout ref.
#
# Never add a step here that executes PR-ref content. The PR checkout is read
# by the base checker; it is never run.
#
# Deliberately not path-filtered: the violation this catches is a brand-new
# module adding its own INSERT, and a new file matches no pre-existing filter.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contact-write-boundary:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base (the checker)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout PR tree (scanned as data, never executed)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Contact write-boundary check (base checker vs PR tree)
        run: |
          set -euo pipefail
          # POLICY (allow-list, blocking classes) comes from the base revision
          # so a PR cannot widen it. The INVENTORY is checked against the
          # scanned tree's own baseline, so adding or removing a write site
          # must appear as a reviewable baseline diff in the same PR rather
          # than deadlocking on a base file that only updates at merge.
          python base/scripts/check_contact_write_boundary.py \
            --root pr \
            --baseline base/tests/contact_write_boundary/baseline.json \
            --inventory-baseline pr/tests/contact_write_boundary/baseline.json

      - name: Detector self-tests (base checker, base fixtures)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # pytest-asyncio is required by tests/conftest.py, which pytest loads
          # for any test under tests/ even though this detector is stdlib-only.
          python -m pip install pytest pytest-asyncio
          cd base
          python -m pytest tests/test_contact_write_boundary.py -q

  contact-write-boundary-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Contact write-boundary check
        run: |
          set -euo pipefail
          python scripts/check_contact_write_boundary.py \
            --baseline tests/contact_write_boundary/baseline.json

      - name: Detector self-tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pytest tests/test_contact_write_boundary.py -q
