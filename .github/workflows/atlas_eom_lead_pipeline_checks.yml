jobs:
  eom-lead-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_migration_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_migration_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      first-clean-postgres:
        image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_USER: atlas_eom_test_dba
          POSTGRES_PASSWORD: atlas-eom-test-dba
          POSTGRES_DB: atlas_eom_first_clean_tests
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U atlas_eom_test_dba -d atlas_eom_first_clean_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_MIGRATION_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_migration_tests
      ATLAS_EOM_FIRST_CLEAN_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5433/atlas_eom_first_clean_tests
      ATLAS_EOM_FIRST_CLEAN_DBA_DATABASE_URL: postgresql://atlas_eom_test_dba:atlas-eom-test-dba@localhost:5433/atlas_eom_first_clean_tests
      ATLAS_DATABASE_ROLE_TOPOLOGY_TEST_DBA_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_migration_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Provision isolated first-clean runtime role
        env:
          FIRST_CLEAN_TEST_DBA_DATABASE_URL: postgresql://atlas_eom_test_dba:atlas-eom-test-dba@localhost:5433/atlas_eom_first_clean_tests
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(
                  os.environ["FIRST_CLEAN_TEST_DBA_DATABASE_URL"]
              )
              try:
                  await connection.execute(
                      "CREATE ROLE atlas LOGIN PASSWORD 'atlas' NOINHERIT "
                      "NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION "
                      "NOBYPASSRLS"
                  )
                  await connection.execute(
                      "GRANT CREATE ON DATABASE atlas_eom_first_clean_tests TO atlas"
                  )
              finally:
                  await connection.close()


          asyncio.run(main())
          PY

      - name: Run EOM lead pipeline checks
        run: |
          # test_eom_billing_recipients.py is enrolled here as well as in the
          # invoicing workflow: eom_crm_mutations triggers THIS workflow, and
          # its normalize_contact_email decides billing-recipient eligibility
          # and the address those routes return.
          python -m pytest \
            tests/test_ack_commercial_templates.py \
            tests/test_ack_variant_classification.py \
            tests/test_call_intelligence.py \
            tests/test_crm_read_scoping.py \
            tests/test_eom_complaints_integration.py \
            tests/test_eom_contacts_api_tenant_scope.py \
            tests/test_backfill_eom_customer_type.py \
            tests/test_eom_link_verification.py \
            tests/test_eom_contact_directory.py \
            tests/test_eom_contact_archive.py \
            tests/test_eom_billing_recipients.py \
            tests/test_eom_lead_conversion.py \
            tests/test_eom_missed_call_recovery.py \
            tests/test_eom_missed_call_privilege_runner.py \
            tests/test_eom_first_clean_completion.py \
            tests/test_eom_first_clean_completion_dba_runner.py \
            tests/test_eom_terms_authority.py \
            tests/test_database_role_topology_preflight.py \
            tests/test_eom_lead_conversion_integration.py \
            tests/test_eom_render_profile.py \
            tests/test_eom_funnel_capability_manifest.py \
            tests/test_eom_public_onboarding.py \
            tests/test_eom_write_boundary_audit.py \
            tests/test_eom_lead_pipeline_integration.py \
            tests/test_eom_mailbox_context_binding.py \
            tests/test_eom_lead_ingress.py \
            tests/test_eom_recurring_appointments_integration.py \
            tests/test_eom_scoped_gmail_credentials.py \
            tests/test_eom_scoped_gmail_hardening.py \
            tests/test_eom_sent_email_tenant_scope.py \
            tests/test_leads_intake.py \
            tests/test_migrations_runner.py \
            tests/test_migration_365_business_context_fk.py \
            -q
