jobs:
  eom-lead-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_migration_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_migration_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_MIGRATION_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_migration_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run EOM lead pipeline checks
        run: |
          # The test set lives in tests/eom_lead_pipeline_files.txt, which the
          # local mirror script reads too. Neither side keeps its own copy, so
          # "I ran what CI runs" cannot quietly stop being true.
          grep -v '^[[:space:]]*#' tests/eom_lead_pipeline_files.txt \
            | grep -v '^[[:space:]]*$' \
            | xargs python -m pytest -q
