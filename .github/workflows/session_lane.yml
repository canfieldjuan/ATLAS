name: Session Lane

# Trusted-base execution (#2104): this producer runs from the base branch,
# checks out the base SHA for executable code, and materializes the PR head only
# as git data for scripts/audit_pr_session_drift.py. Do not add steps that
# execute scripts, tests, package code, or workflow code from the PR worktree.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  session-lane:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Materialize PR head as data
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
          git worktree add "$RUNNER_TEMP/pr-tree" "refs/remotes/origin/pr-${PR_NUMBER}"
          git -C "$RUNNER_TEMP/pr-tree" symbolic-ref "refs/remotes/origin/HEAD" "refs/remotes/origin/${BASE_REF}" || true

      - name: Write current PR body
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = event.get("pull_request", {}).get("body") or ""
          Path(os.environ["RUNNER_TEMP"], "current-pr-body.md").write_text(
              body,
              encoding="utf-8",
          )
          PY

      - name: Audit session lane
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          current_pr_state="$(gh pr view "${PR_NUMBER}" --json state --jq '.state')"
          case "${current_pr_state}" in
            OPEN)
              ;;
            CLOSED|MERGED)
              echo "Session Lane skipped: PR #${PR_NUMBER} is ${current_pr_state}."
              exit 0
              ;;
            *)
              echo "::error::unexpected PR state: ${current_pr_state:-<empty>}"
              exit 1
              ;;
          esac
          cd "$RUNNER_TEMP/pr-tree"
          python "$GITHUB_WORKSPACE/scripts/audit_pr_session_drift.py" \
            "origin/${BASE_REF}" \
            --current-pr-body-file "$RUNNER_TEMP/current-pr-body.md" \
            --require-current-pr-body
