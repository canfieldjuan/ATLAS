name: Pre-push Audit

# Trusted-base execution (#1949 follow-up): PR events run this workflow from the
# base branch and checkout the base SHA for executable code. The PR head is
# materialized as a separate worktree and inspected as data by base-owned
# scripts. Do not add a PR-event step that executes scripts, tests, or package
# code from the PR worktree.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-push-audit:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Materialize PR head as data
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
          git worktree add "$RUNNER_TEMP/pr-tree" "refs/remotes/origin/pr-${PR_NUMBER}"
          git -C "$RUNNER_TEMP/pr-tree" symbolic-ref "refs/remotes/origin/HEAD" "refs/remotes/origin/${BASE_REF}" || true

      - name: Write current PR body
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = event.get("pull_request", {}).get("body") or ""
          Path(os.environ["RUNNER_TEMP"], "current-pr-body.md").write_text(
              body,
              encoding="utf-8",
          )
          PY

      - name: Run local PR review bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          bash scripts/local_pr_review.sh \
            --repo-root "$RUNNER_TEMP/pr-tree" \
            --script-root "$GITHUB_WORKSPACE" \
            --current-pr-body-file "$RUNNER_TEMP/current-pr-body.md" \
            --pr-author "$PR_AUTHOR" \
            "origin/${BASE_REF}"

      # Unit-cover the PR-review tooling itself (including the plans-archive
      # advisory). On pull_request_target these are trusted-base tests only;
      # the PR checkout above is data and must not be executed.
      - name: PR-review tooling unit tests
        run: |
          python -m pip install --quiet pytest pytest-asyncio pyyaml jsonschema httpx
          python -m pytest tests/test_local_pr_review.py tests/test_audit_plan_code_consistency.py tests/test_audit_pr_side_docs_test_consistency.py tests/test_audit_ai_reconciliation.py tests/test_audit_fix_loop_disposition.py tests/test_audit_review_rules_triggered.py tests/test_summarize_review_misses.py tests/test_check_ai_reconciliation_live.py tests/test_pre_push_audit_workflow.py tests/test_pr_body_contract_workflow.py tests/test_codex_review_scope_policy.py tests/test_push_pr_wrapper.py tests/test_open_pr_wrapper.py tests/test_audit_pr_body.py tests/test_audit_pr_plan_presence.py tests/test_plan_admission_workflow.py tests/test_audit_plan_doc.py tests/test_audit_pr_session_drift.py tests/test_session_lane_workflow.py tests/test_new_pr_plan.py tests/test_pre_push_audit.py tests/test_check_deflection_full_report_proof_bundle.py tests/test_check_gitleaks_baseline_rotation.py tests/test_security_guardrails_workflow.py tests/test_audit_workflow_security_posture.py tests/test_claude_workflow_security.py tests/test_deflection_report_ttl_workflow.py tests/test_fix_mode_hook.py tests/test_eval_local_mcp_models.py tests/test_check_diff_budget.py tests/test_codex_wake_bridge.py tests/test_watch_owned_pr.py tests/test_audit_pr_watcher_safety.py tests/test_report_pr_watcher_state.py -q

      - name: Workflow security posture audit
        run: python scripts/audit_workflow_security_posture.py "$RUNNER_TEMP/pr-tree/.github/workflows"

  pre-push-audit-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Resolve origin HEAD
        run: |
          git remote set-head origin --auto || git remote set-head origin main

      - name: Run local PR review bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/local_pr_review.sh

      - name: PR-review tooling unit tests
        run: |
          python -m pip install --quiet pytest pytest-asyncio pyyaml jsonschema httpx
          python -m pytest tests/test_local_pr_review.py tests/test_audit_plan_code_consistency.py tests/test_audit_pr_side_docs_test_consistency.py tests/test_audit_ai_reconciliation.py tests/test_audit_fix_loop_disposition.py tests/test_audit_review_rules_triggered.py tests/test_summarize_review_misses.py tests/test_check_ai_reconciliation_live.py tests/test_pre_push_audit_workflow.py tests/test_pr_body_contract_workflow.py tests/test_codex_review_scope_policy.py tests/test_push_pr_wrapper.py tests/test_open_pr_wrapper.py tests/test_audit_pr_body.py tests/test_audit_pr_plan_presence.py tests/test_plan_admission_workflow.py tests/test_audit_plan_doc.py tests/test_audit_pr_session_drift.py tests/test_session_lane_workflow.py tests/test_new_pr_plan.py tests/test_pre_push_audit.py tests/test_check_deflection_full_report_proof_bundle.py tests/test_check_gitleaks_baseline_rotation.py tests/test_security_guardrails_workflow.py tests/test_audit_workflow_security_posture.py tests/test_claude_workflow_security.py tests/test_deflection_report_ttl_workflow.py tests/test_fix_mode_hook.py tests/test_eval_local_mcp_models.py tests/test_check_diff_budget.py tests/test_codex_wake_bridge.py tests/test_watch_owned_pr.py tests/test_audit_pr_watcher_safety.py tests/test_report_pr_watcher_state.py -q

      - name: Workflow security posture audit
        run: python scripts/audit_workflow_security_posture.py .github/workflows
