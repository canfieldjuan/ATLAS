name: Unit Gate

# The per-area checks are path-filtered and run hand-maintained test lists, so a
# test file that no workflow enrolls can pass CI while never executing
# (#2035 / G1.1, G2). This gate runs on every PR and ratchets against
# tests/unit_gate_baseline.txt. It selects impacted unit tests when the selector
# can map the diff, escalates to the full non-integration/e2e unit suite when the
# selector is absent or returns FULL, and runs the baseline growth guard only when
# no changed file is reachable from a test.
#
# Visible CI, not branch-required: the 2026-08-04 enrollment audit keeps this
# check outside branch protection until the docs/security selector coverage gap
# and other recorded blockers are closed.

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the base ref for the ratchet growth guard
          # Test the PR HEAD, not the default merge-with-base ref: the ratchet
          # baseline is a deterministic target only if concurrent main advances
          # cannot leak new failures into this run. Merge-time breakage with
          # current main is covered by the cross-session drift auditor, not here.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pinned: the baseline is only stable for the pytest/plugin versions
          # that produced it -- an unpinned pytest could shift collection or the
          # summary format and drift the ledger (matches requirements.content_ops_ci.txt).
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Resolve base-branch baseline (for the ratchet growth guard)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}"
          # Compare against the baseline at the MERGE BASE, not current main.
          # If main has shrunk the baseline since this branch was cut, the
          # branch's own (larger) baseline looks like GROWTH against current
          # main and added_baseline_entries() fails a PR that added nothing.
          # The merge base is the baseline this branch actually forked from,
          # which is what the ratchet means by "did this PR grow it".
          MB=$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null || echo "")
          # empty file when the base has no baseline yet (this PR seeds it)
          if [ -n "$MB" ]; then
            git show "${MB}:tests/unit_gate_baseline.txt" \
              > /tmp/base_baseline.txt 2>/dev/null || : > /tmp/base_baseline.txt
          else
            git show "origin/${BASE_REF}:tests/unit_gate_baseline.txt" \
              > /tmp/base_baseline.txt 2>/dev/null || : > /tmp/base_baseline.txt
          fi

      - name: Select impacted tests
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}"
          # The workflow definition comes from the merged ref, but the tree is
          # the PR head. Any branch cut before the selector landed has no
          # scripts/select_impacted_tests.py, and calling it there fails the
          # gate on every such PR -- unrelated work broken purely because main
          # advanced. Absent selector is just another input we cannot map:
          # escalate to FULL, which is what the selector itself would do.
          if [ ! -f scripts/select_impacted_tests.py ]; then
            echo "selector absent from this PR head (branch predates it); running FULL"
            echo FULL > /tmp/selected.txt
          else
            python scripts/select_impacted_tests.py \
              --base "origin/${BASE_REF}" > /tmp/selected.txt
          fi
          echo "--- selection ---"
          cat /tmp/selected.txt

      - name: Unit gate (ratchet against baseline)
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/selected.txt)" = "FULL" ]; then
            echo "running the FULL suite (selection escalated)"
            python scripts/check_unit_gate.py \
              --baseline tests/unit_gate_baseline.txt \
              --base-baseline /tmp/base_baseline.txt
          elif [ ! -s /tmp/selected.txt ]; then
            # Every changed file mapped, none is reachable from any test.
            # The growth guard still runs -- it is a text comparison and must
            # not be skippable by touching only non-Python files.
            echo "no test is reachable from the changed files; growth guard only"
            python scripts/check_unit_gate.py \
              --baseline tests/unit_gate_baseline.txt \
              --base-baseline /tmp/base_baseline.txt \
              --growth-only
          else
            echo "running $(wc -l < /tmp/selected.txt) impacted test file(s)"
            python scripts/check_unit_gate.py \
              --baseline tests/unit_gate_baseline.txt \
              --base-baseline /tmp/base_baseline.txt \
              --selected-files /tmp/selected.txt \
              --pytest-args $(tr '\n' ' ' < /tmp/selected.txt) \
                -m "not integration and not e2e" \
                --continue-on-collection-errors -rfE --tb=no -q \
                -p no:cacheprovider
          fi
