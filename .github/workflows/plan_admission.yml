name: Plan Admission

# Trusted-base execution (#2104): this producer runs from the base branch,
# checks out the base SHA for executable code, and materializes the PR head only
# as git data for scripts/audit_pr_plan_presence.py. Do not add steps that
# execute scripts, tests, package code, or workflow code from the PR worktree.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  plan-admission:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Materialize PR head as data
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
          git worktree add "$RUNNER_TEMP/pr-tree" "refs/remotes/origin/pr-${PR_NUMBER}"
          git -C "$RUNNER_TEMP/pr-tree" symbolic-ref "refs/remotes/origin/HEAD" "refs/remotes/origin/${BASE_REF}" || true

      - name: Audit plan admission
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          cd "$RUNNER_TEMP/pr-tree"
          ATLAS_AUDIT_REPO_ROOT="$RUNNER_TEMP/pr-tree" \
            python "$GITHUB_WORKSPACE/scripts/audit_pr_plan_presence.py" \
            "origin/${BASE_REF}" \
            --pr-author "$PR_AUTHOR"
