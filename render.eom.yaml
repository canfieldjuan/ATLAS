# Blueprint candidate for the slim Atlas EOM API.
#
# This file is deliberately not named render.yaml yet. The EOM time tracker is
# already managed on Render; this candidate should be connected manually as a
# new private service after the branch is reviewed.
databases:
  - name: atlas-eom-postgres
    databaseName: atlas_eom
    user: atlas_eom
    ipAllowList: []

services:
  - type: pserv
    name: atlas-eom-api
    runtime: python
    buildCommand: pip install -r requirements.eom.txt
    startCommand: uvicorn atlas_brain.main_eom:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ATLAS_DB_ENABLED
        value: "true"
      - key: ATLAS_DB_CONNECTION_STRING
        fromDatabase:
          name: atlas-eom-postgres
          property: connectionString
      - key: ATLAS_INVOICING_RECEIVABLES_API_ENABLED
        value: "false"
      - key: ATLAS_INVOICING_RECEIVABLES_SERVICE_TOKEN_SHA256
        sync: false
      - key: ATLAS_EOM_FUNNEL_API_ENABLED
        value: "false"
      - key: ATLAS_EOM_FUNNEL_SERVICE_TOKEN_SHA256
        sync: false
      - key: ATLAS_EOM_FUNNEL_DB_CONNECTION_STRING
        sync: false
      - key: ATLAS_EOM_FUNNEL_PUBLIC_ONBOARDING_ENABLED
        value: "false"
      - key: ATLAS_EOM_FUNNEL_PUBLIC_ONBOARDING_ISSUANCE_ENABLED
        value: "false"
      - key: ATLAS_EOM_FUNNEL_PUBLIC_ONBOARDING_URL
        sync: false
      - key: ATLAS_EOM_FUNNEL_PUBLIC_ONBOARDING_HMAC_SECRET
        sync: false
      - key: ATLAS_EOM_FUNNEL_PUBLIC_ONBOARDING_PREVIOUS_HMAC_SECRET
        sync: false
      # A separate Stripe authority from Atlas SaaS billing. Keep the feature
      # disabled until migration 398, the dedicated webhook, and consumers are
      # deployed; `sync: false` prevents secrets from entering this blueprint.
      - key: ATLAS_EOM_FUNNEL_CARD_VAULT_ENABLED
        value: "false"
      - key: ATLAS_EOM_FUNNEL_CARD_VAULT_STRIPE_SECRET_KEY
        sync: false
      - key: ATLAS_EOM_FUNNEL_CARD_VAULT_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ATLAS_EOM_FUNNEL_CARD_VAULT_REQUEST_TIMEOUT_SECONDS
        value: "10"
      # Remains fail-closed until the Atlas provider, tracker proxy, and CRM
      # Leads card are all deployed. The booking URL is intentionally a
      # deploy-time secret/configuration value rather than repository copy.
      - key: ATLAS_EOM_FUNNEL_MISSED_CALL_RECOVERY_ENABLED
        value: "false"
      - key: ATLAS_EOM_FUNNEL_MISSED_CALL_BOOKING_LINK
        sync: false
      - key: ATLAS_EOM_FUNNEL_MISSED_CALL_TIMEZONE
        value: "America/Chicago"
      - key: ATLAS_EOM_CANONICAL_CRM_DATABASE_CONFIRMED
        value: "false"
      - key: ATLAS_EOM_RUN_MIGRATIONS
        value: "true"
      - key: ATLAS_TOOLS_CALENDAR_ENABLED
        value: "true"
      - key: ATLAS_TOOLS_CALENDAR_CLIENT_ID
        sync: false
      - key: ATLAS_TOOLS_CALENDAR_CLIENT_SECRET
        sync: false
      - key: ATLAS_TOOLS_CALENDAR_REFRESH_TOKEN
        sync: false
      - key: ATLAS_TOOLS_CALENDAR_ID
        sync: false
